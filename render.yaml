services:
  # Backend Web Service (Node.js API)
  - type: web
    name: hackathon-3-kpc-yard
    env: node
    plan: free
    region: oregon
startCommand: npm start
    buildCommand: npm install --include=dev
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: EMULATOR_MODE
        value: "true"
      - key: SIMULATE_PUMP_FLOW
        value: "true"
      - key: SIM_MINUTES_PER_LOOP
        value: "180"

  # Frontend Static Site (React Vite)
  - type: web
    name: kpc-yard-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hackathon-3-kpc-yard
          property: host
          envVarKey: VITE_API_URL
          transform: "https://${host}/api"
